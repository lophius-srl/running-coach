name: 🐛 Bug
description: Quelque chose ne fonctionne pas comme prévu
labels: ["type: bug", "status: triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environnement
      placeholder: "ex. prod, Chrome 130, Android 15, version 1.2.0"
  - type: textarea
    id: logs
    attributes:
      label: Logs ou captures
      render: shell
