name: Claude Code Review

# Relecture automatique de chaque PR par Claude (en plus de ta propre relecture).
# Prérequis : secret CLAUDE_CODE_OAUTH_TOKEN (généré avec `claude setup-token`) et l'app GitHub Claude installée.
# Chaque review consomme des minutes GitHub Actions et ton quota d'abonnement Claude.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  # Relecture à la demande : onglet Actions → "Claude Code Review" → Run workflow
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Numéro de la PR à relire"
        required: true

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Pas de review sur les brouillons, ni sur les PR Dependabot (pas d'accès aux secrets).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

            Tu es le reviewer du projet. Suis exactement les instructions de `.claude/agents/reviewer.md`
            et les conventions de `CLAUDE.md`.
            Récupère le diff avec `gh pr diff`, les commentaires existants avec `gh pr view --comments`,
            et l'issue liée (« Closes #N ») avec `gh issue view`.
            Rédige la review en français, avec le classement 🔴 / 🟠 / 🟢 et un verdict final.
            Poste-la en un seul commentaire avec `gh pr comment`.
          claude_args: >-
            --allowed-tools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
