name: Deploy

# Déploiement sur Cloudflare Workers après chaque merge sur main, une fois la CI verte.
# Secrets à créer dans Settings → Environments → production :
#   CLOUDFLARE_API_TOKEN  (permissions : Account › Workers Scripts › Edit ET Account › D1 › Edit, voir ADR 0002)
#   CLOUDFLARE_ACCOUNT_ID
# Les secrets applicatifs (STRAVA_CLIENT_SECRET…) se posent avec `pnpm exec wrangler secret put <NOM>`.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Le filtre `branches: [main]` de workflow_run porte sur le nom de branche seul : une PR ouverte
    # depuis la branche `main` d'un fork passerait. On exige donc un push sur main de CE dépôt,
    # et un lancement manuel uniquement depuis main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Déploie exactement le commit validé par la CI.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      - name: Check Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents de l'environnement production."
          exit 1

      - name: Install and build
        run: make install build

      # Après le build (un build cassé ne touche pas la base), avant le déploiement (le nouveau code
      # peut dépendre du nouveau schéma). Un échec arrête le job : le Worker n'est pas déployé.
      - name: Apply D1 migrations (remote)
        run: make db-migrate-remote

      - name: Deploy
        run: make deploy
