version: 2
updates:
  # Met à jour les actions GitHub utilisées par les workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: ["type: chore", "dependencies"]

  # Dépendances npm (pnpm-lock.yaml est pris en charge par l'écosystème npm).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: ["type: chore", "dependencies"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
