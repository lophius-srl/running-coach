version: 2
updates:
  # Met à jour les actions GitHub utilisées par les workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: ["type: chore", "dependencies"]

